<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rebound</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <img class="popup-logo" src="../assets/icon48.png" alt="" width="40" height="40" />
        <div>
          <h1>Rebound</h1>
          <p>Restore delivery for bounced emails</p>
        </div>
        <span class="popup-version">v1.3.0</span>
      </header>

      <label class="popup-status">
        <span class="popup-status-dot"></span>
        <span class="popup-status-copy">
          <strong>Operations panel</strong>
          <small data-panel-status>Checking current tab…</small>
        </span>
        <input type="checkbox" data-panel-toggle checked disabled />
        <span class="popup-toggle" aria-hidden="true"><span></span></span>
      </label>

      <section class="popup-capabilities" aria-label="Capabilities">
        <div><span>⌁</span><strong>Find</strong><small>Bounce events</small></div>
        <div><span>✓</span><strong>Restore</strong><small>Email delivery</small></div>
        <div><span>⇩</span><strong>Audit</strong><small>CSV exports</small></div>
      </section>

      <nav class="popup-links" aria-label="Rebound links">
        <a href="https://github.com/noelmom/rebound" target="_blank" rel="noreferrer"><span>Project page</span><b>↗</b></a>
        <a href="https://github.com/noelmom/rebound/issues" target="_blank" rel="noreferrer"><span>Help &amp; feedback</span><b>↗</b></a>
      </nav>

      <footer>
        <span>Private by design · Local processing only</span>
        <span class="popup-disclaimer">Independent and not affiliated with Okta, Inc.</span>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
